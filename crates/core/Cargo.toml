serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
toml = "1.1"
trash = "5.2"
unicode-width = "0.2"
which.workspace = true

[dev-dependencies]
tempfile = "3.10"
